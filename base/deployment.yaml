apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  labels:
    app: quote-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quote-api
  template:
    metadata:
      labels:
        app: quote-api
    spec:
      containers:
        - name: quote-api
          image: quote-api   # nom générique, remplacé par l'image réelle dans l'overlay dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: quote-api-config   # toutes les clés deviennent des variables d'environnement
          readinessProbe:          # "es-tu prêt à recevoir du trafic ?" sinon retiré du Service
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:           # "es-tu encore en vie ?" sinon le conteneur est redémarré
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
