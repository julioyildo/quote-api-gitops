apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  labels:
    app: quote-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quote-api
  template:
    metadata:
      labels:
        app: quote-api
    spec:
      containers:
        - name: quote-api
          image: quote-api   # nom générique, remplacé par l'image réelle dans l'overlay dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: quote-api-config   # toutes les clés deviennent des variables d'environnement
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
