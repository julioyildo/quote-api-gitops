apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  labels:
    app: quote-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # au plus 1 pod en plus pendant la mise à jour (3 au total)
      maxUnavailable: 0    # jamais moins de 2 pods prêts : aucune coupure
  selector:
    matchLabels:
      app: quote-api
  template:
    metadata:
      labels:
        app: quote-api
    spec:
      serviceAccountName: quote-api   # identité propre au pod (au lieu de "default")
      securityContext:             # règles de sécurité pour tout le pod
        runAsNonRoot: true         # refuse de démarrer si l'image tourne en root
        seccompProfile:
          type: RuntimeDefault     # filtre les appels système dangereux
      containers:
        - name: quote-api
          image: quote-api   # nom générique, remplacé par l'image réelle dans l'overlay dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: quote-api-config   # toutes les clés deviennent des variables d'environnement
          readinessProbe:          # "es-tu prêt à recevoir du trafic ?" sinon retiré du Service
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:           # "es-tu encore en vie ?" sinon le conteneur est redémarré
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:         # règles de sécurité pour ce conteneur
            allowPrivilegeEscalation: false   # interdit de devenir root en cours de route
            capabilities:
              drop: ["ALL"]        # retire tous les privilèges Linux spéciaux
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
